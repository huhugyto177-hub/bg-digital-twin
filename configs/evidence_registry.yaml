context_of_use: Mechanistic circuit-level translation of defined receptor/channel/pathway
  modulations and PK exposure curves to predicted basal ganglia activity, proxy LFP
  beta-band shifts, and motor-readiness readouts.
calibration_note: Calibrated to directional consensus from the literature listed below
  (pathway polarity, PD hypo-/hyperkinetic tendencies, L-DOPA restoration vs overdrive
  risk, D1 vs D2 engagement, STN-GPe beta associations). The twin does NOT invent
  binding affinity, BBB permeability, toxicity, or clinical efficacy for novel structures
  — those must be user-supplied assay/PK assumptions or left unknown. New illustration
  scenarios say when a timing value is a scenario timebase rather than a published
  PK parameter.
non_claims:
- Does not predict de novo chemical binding affinity from SMILES/structures.
- Does not predict blood-brain barrier permeability.
- Does not predict peripheral ADMET/toxicity.
- Does not claim clinical efficacy without experimental validation.
- Does not invent EC50/Cmax/half-life for newly discovered molecules; user must supply
  mechanistic and PK assumptions.
