name: overdrive_dyskinesia_case
description: High-dose DA over-restoration scenario expected to elevate dyskinesia/over-drive risk proxy.
baseline_preset: pd_depleted
simulation:
  duration_h: 8.0
  dt_h: 0.05
  noise_std: 0.0
  seed: 42
  n_sensitivity_runs: 20
perturbation:
  name: Overdrive DA restoration
  description: Aggressive combined DA + D1 facilitation intended to trigger over-drive flag.
  notes: Illustrative toxicity/side-effect proxy scenario — not a recommended regimen.
  pk:
    onset_h: 0.1
    tmax_h: 0.9
    half_life_h: 2.5
    cmax_nM: 2500.0
    n_doses: 1
  modulations:
    - target_node: dopamine_tone
      mechanism: agonist
      max_effect: 1.6
      ec50_nM: 200.0
      hill_coeff: 1.0
    - target_node: d1_direct
      mechanism: agonist
      max_effect: 1.2
      ec50_nM: 150.0
      hill_coeff: 1.1
expected:
  overdrive_flag: true
