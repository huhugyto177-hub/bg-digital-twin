name: ldopa_normalized_reference
description: L-DOPA-like combined dopamine-tone, D1, and D2 illustration on the PD
  baseline. Normalized exposure only.
illustration: mechanistic
potency_note: Mechanistic illustration, not a clinical claim and not a calibrated
  regimen. potency not specified; normalized exposure shape.
evidence_ids:
- contin_2010
- nutt_2008
- nutt_holford_1996
pk_timing_notes: onset_h 0, tmax_h 1, and half_life_h 2 are the shared illustration
  timebase, not published PK, except where a field is explicitly sourced below.
baseline_preset: pd_depleted
simulation:
  duration_h: 8.0
  dt_h: 0.05
  noise_std: 0.0
  seed: 42
  n_sensitivity_runs: 8
perturbation:
  name: L-DOPA normalized reference
  description: Mechanistic illustration of combined dopaminergic tone.
  notes: Mechanistic illustration, not a clinical claim and not a calibrated regimen.
    potency not specified; normalized exposure shape. onset_h 0, tmax_h 1, and half_life_h
    2 are the shared illustration timebase, not published PK, except where a field
    is explicitly sourced below.
  pk:
    onset_h: 0.0
    tmax_h: 1.0
    half_life_h: 2.0
    n_doses: 1
  modulations:
  - target_node: dopamine_tone
    mechanism: agonist
    max_effect: 0.9
    hill_coeff: 1.0
  - target_node: d1_direct
    mechanism: agonist
    max_effect: 0.45
    hill_coeff: 1.0
  - target_node: d2_indirect
    mechanism: agonist
    max_effect: 0.3
    hill_coeff: 1.0
expected:
  restores_motor_suppresses_beta: true
